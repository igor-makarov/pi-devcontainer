name: "CI - Test Features"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-autogenerated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:ubuntu
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up tools with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Test Pi against ${{ matrix.baseImage }}
        run: >-
          devcontainer features test
          --project-folder .
          --features pi
          --base-image ${{ matrix.baseImage }}
          --skip-scenarios

  test-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up tools with mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Test Pi scenarios
        run: >-
          devcontainer features test
          --project-folder .
          --features pi
          --skip-autogenerated
          --skip-duplicated
